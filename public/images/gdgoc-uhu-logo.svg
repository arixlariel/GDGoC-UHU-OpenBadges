<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <!-- Google Developer Group Brackets -->
  <g transform="translate(10, 20)">
    <!-- Red left top angle -->
    <path d="M 35 15 L 15 40 L 35 65" stroke="#EA4335" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Blue right bottom angle -->
    <path d="M 65 15 L 85 40 L 65 65" stroke="#4285F4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Yellow slash -->
    <line x1="45" y1="65" x2="55" y2="15" stroke="#FBBC04" stroke-width="10" stroke-linecap="round"/>
    <!-- Green dot -->
    <circle cx="50" cy="40" r="4" fill="#34A853"/>
  </g>

  <!-- Typography -->
  <text x="120" y="48" font-family="'Google Sans', 'Inter', system-ui, sans-serif" font-weight="700" font-size="28" fill="#1F1F1F">
    GDG <tspan fill="#5F6368" font-weight="400">on Campus</tspan>
  </text>
  <text x="120" y="78" font-family="'Google Sans', 'Inter', system-ui, sans-serif" font-weight="500" font-size="20" fill="#003366">
    Universidad de Huelva
  </text>
  <rect x="120" y="88" width="60" height="3" fill="#4285F4" rx="1.5"/>
  <rect x="185" y="88" width="25" height="3" fill="#EA4335" rx="1.5"/>
  <rect x="215" y="88" width="25" height="3" fill="#FBBC04" rx="1.5"/>
  <rect x="245" y="88" width="35" height="3" fill="#34A853" rx="1.5"/>
</svg>

