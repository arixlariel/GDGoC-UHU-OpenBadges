<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="33%" stop-color="#34A853" />
      <stop offset="66%" stop-color="#FBBC04" />
      <stop offset="100%" stop-color="#EA4335" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagon / Shield -->
  <polygon points="200,20 360,110 360,290 200,380 40,290 40,110" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Inner Hexagon Accent -->
  <polygon points="200,45 335,120 335,275 200,355 65,275 65,120" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Tech circuits / nodes -->
  <circle cx="200" cy="110" r="6" fill="#38BDF8"/>
  <circle cx="130" cy="150" r="4" fill="#34A853"/>
  <circle cx="270" cy="150" r="4" fill="#EA4335"/>
  <line x1="200" y1="110" x2="130" y2="150" stroke="#334155" stroke-width="2"/>
  <line x1="200" y1="110" x2="270" y2="150" stroke="#334155" stroke-width="2"/>

  <!-- Center Graphic: Code Brackets & Lightning Bolt -->
  <g transform="translate(145, 140)">
    <!-- Brackets -->
    <path d="M 15 20 L 0 50 L 15 80" stroke="#4285F4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 95 20 L 110 50 L 95 80" stroke="#34A853" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Lightning / Bolt -->
    <polygon points="62,10 40,55 58,55 48,95 76,45 56,45" fill="#FBBC04" filter="url(#glow)"/>
  </g>

  <!-- Text -->
  <text x="200" y="275" font-family="'JetBrains Mono', 'Google Sans', monospace" font-weight="900" font-size="24" fill="#F8FAFC" text-anchor="middle" letter-spacing="3">
    HACKATHON
  </text>
  <text x="200" y="305" font-family="'Google Sans', 'Inter', sans-serif" font-weight="700" font-size="16" fill="#38BDF8" text-anchor="middle" letter-spacing="1">
    GDG ON CAMPUS UHU
  </text>
  <text x="200" y="330" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="14" fill="#94A3B8" text-anchor="middle">
    2026 EDITION
  </text>
</svg>
