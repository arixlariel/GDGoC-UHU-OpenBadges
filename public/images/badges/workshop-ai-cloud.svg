<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="circleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#1A73E8" />
    </linearGradient>
  </defs>

  <!-- Outer Ring with Google Colors -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="#E2E8F0" stroke-width="12"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="#4285F4" stroke-width="12" stroke-dasharray="290 870" stroke-linecap="round"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="#EA4335" stroke-width="12" stroke-dasharray="290 870" stroke-dashoffset="-290" stroke-linecap="round"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="#FBBC04" stroke-width="12" stroke-dasharray="290 870" stroke-dashoffset="-580" stroke-linecap="round"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="#34A853" stroke-width="12" stroke-dasharray="290 870" stroke-dashoffset="-870" stroke-linecap="round"/>

  <!-- Inner Background -->
  <circle cx="200" cy="200" r="170" fill="url(#circleBg)"/>

  <!-- Cloud Shape -->
  <g transform="translate(110, 110)">
    <!-- Base Cloud -->
    <path d="M 130 90 A 40 40 0 0 0 70 50 A 30 30 0 0 0 25 75 A 25 25 0 0 0 30 120 L 150 120 A 30 30 0 0 0 130 90 Z" fill="url(#cloudGrad)"/>
    
    <!-- Gemini AI 4-point Star -->
    <path d="M 125 30 Q 125 50 105 50 Q 125 50 125 70 Q 125 50 145 50 Q 125 50 125 30 Z" fill="#FBBC04"/>
    <path d="M 155 20 Q 155 32 143 32 Q 155 32 155 44 Q 155 32 167 32 Q 155 32 155 20 Z" fill="#EA4335"/>
  </g>

  <!-- Title Badge -->
  <rect x="90" y="245" width="220" height="34" rx="17" fill="#003366"/>
  <text x="200" y="268" font-family="'Google Sans', 'Inter', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    CLOUD &amp; GEN AI
  </text>

  <text x="200" y="305" font-family="'Google Sans', 'Inter', sans-serif" font-weight="700" font-size="15" fill="#1E293B" text-anchor="middle">
    GDG on Campus UHU
  </text>
  <text x="200" y="325" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#64748B" text-anchor="middle">
    Taller Certificado Oficial
  </text>
</svg>
