name: Deploy Open Badges to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'vercel-openbadges-production'
  cancel-in-progress: false

jobs:
  deploy:
    name: Build Open Badges (OB3 + OG) & Deploy to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Procesar publicaciones pendientes (publish.json o carpetas publish/)
        run: |
          node scripts/process-publish.mjs

      - name: Descargar configuración de proyecto Vercel (gdgoc-uhu-openbadges)
        run: npx --yes vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Compilar Open Badges (OB3 Ed25519 + tarjetas OG 1200x630) para Vercel
        env:
          SITE_URL: "https://gdguhu.com"
          BASE_PATH: "/"
          OB3_PRIVATE_KEY: ${{ secrets.OB3_PRIVATE_KEY }}
        run: npx --yes vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Verificar salida Open Badges 3.0 firmada, tarjetas OG y assets _astro-ob
        run: |
          test -f .vercel/output/static/openbadges/index.html
          test -f .vercel/output/static/openbadges/generador-local.html
          test -f .vercel/output/static/vendor/jsonld.min.js
          test -f .vercel/output/static/og/openbadges.png
          FIRST_OG=$(ls .vercel/output/static/og/cert/*.png | head -n 1)
          test -n "$FIRST_OG"
          test -f .vercel/output/static/.well-known/did.json
          test -f .vercel/output/static/api/badges/issuer.json
          test -f .vercel/output/static/api/badges/styles.json
          test -f .vercel/output/static/api/badges/showcase.json
          test -f .vercel/output/static/api/badges/status/revocations.json
          grep -q '"BitstringStatusListCredential"' .vercel/output/static/api/badges/status/revocations.json
          grep -q '"cryptosuite": "eddsa-rdfc-2022"' .vercel/output/static/api/badges/status/revocations.json
          grep -q '"proofValue": "z' .vercel/output/static/api/badges/status/revocations.json
          test -d .vercel/output/static/_astro-ob
          FIRST_CERT=$(ls .vercel/output/static/openbadges/cert/*/index.html | head -n 1)
          test -n "$FIRST_CERT"
          FIRST_LEGACY_CERT=$(ls .vercel/output/static/cert/*/index.html | head -n 1)
          test -n "$FIRST_LEGACY_CERT"
          FIRST_V3=$(ls .vercel/output/static/api/badges/v3/*.json | head -n 1)
          test -n "$FIRST_V3"
          grep -q '"BitstringStatusListEntry"' "$FIRST_V3"
          grep -q '"cryptosuite": "eddsa-rdfc-2022"' "$FIRST_V3"
          grep -q '"proofValue": "z' "$FIRST_V3"
          echo "OK: Open Badges Multi-Zone + OB3 Ed25519 + W3C BitstringStatusList + OG 1200x630 verificados ($FIRST_V3)"

      - name: Desplegar Open Badges a producción en Vercel
        id: vercel_deploy
        run: |
          DEPLOY_URL=$(npx --yes vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Deployed to: $DEPLOY_URL"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Subir cola temporal de emails (si existe)
        if: hashFiles('/tmp/pending-emails.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pending-emails-queue
          path: /tmp/pending-emails.json
          retention-days: 1

  post-deploy-emails:
    name: Enviar Correos Automáticos (Resend / Gmail) y Limpiar publish/
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Procesar publicaciones, organizar repositorio y enviar correos
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: "GDG on Campus Universidad de Huelva <certificados@gdguhu.com>"
          EMAIL_REPLY_TO: "gdgoc.huelva@gmail.com"
          EMAIL_BCC: "gdgoc.huelva+enviados@gmail.com"
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'arielbustilloleon@gmail.com' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: "https://gdguhu.com"
        run: |
          node scripts/process-publish.mjs

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .
          git add -A src/content/badges/ src/content/assertions/
          if ! git diff --staged --quiet; then
            git commit -m "chore(publish): organizar certificados publicados y limpiar cola temporal [skip ci]"
            git pull --rebase origin main || true
            git push origin main || true
          fi

          if [ -f /tmp/pending-emails.json ]; then
            npm install nodemailer
            node scripts/send-emails.mjs /tmp/pending-emails.json
            rm -f /tmp/pending-emails.json
          fi

  firebase-backup:
    name: Copia de seguridad automática en Firebase Firestore
    needs: [deploy, post-deploy-emails]
    if: always() && needs.deploy.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout última versión de main (incluyendo publish organizados)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sincronizar badges, assertions e imágenes con Firebase Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_ID: "content"
          SITE_URL: "https://gdguhu.com"
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "⚠️ FIREBASE_SERVICE_ACCOUNT no configurado; omitiendo backup en Firestore."
            exit 0
          fi
          node scripts/sync-firebase-backup.mjs
