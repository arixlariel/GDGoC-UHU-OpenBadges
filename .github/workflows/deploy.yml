name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Procesar publicaciones pendientes (publish.json o carpetas publish/)
        run: |
          node scripts/process-publish.mjs

      - name: Build site
        env:
          SITE_URL: "https://gdguhu.es"
          BASE_PATH: "/"
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Subir cola temporal de emails (si existe)
        if: hashFiles('/tmp/pending-emails.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pending-emails-queue
          path: /tmp/pending-emails.json
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  post-deploy-emails:
    name: Enviar Correos Automáticos y Limpiar publish/
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Procesar publicaciones, organizar repositorio y enviar correos
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'gdgoc.huelva@gmail.com' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: "https://gdguhu.es"
        run: |
          node scripts/process-publish.mjs

          git config --global user.name "GDGoC UHU Bot"
          git config --global user.email "gdgoc.huelva@gmail.com"
          git rm -f publish.json 2>/dev/null || true
          git rm -rf publish/ 2>/dev/null || true
          git add -A src/content/badges/ src/content/assertions/
          if ! git diff --staged --quiet; then
            git commit -m "chore(publish): organizar certificados publicados y limpiar cola temporal [skip ci]"
            git pull --rebase origin main || true
            git push origin main || true
          fi

          if [ -f /tmp/pending-emails.json ]; then
            npm install nodemailer
            node scripts/send-emails.mjs /tmp/pending-emails.json || echo "⚠️ Advertencia al enviar correos (comprueba GMAIL_APP_PASSWORD en Secrets)"
            rm -f /tmp/pending-emails.json
          fi

