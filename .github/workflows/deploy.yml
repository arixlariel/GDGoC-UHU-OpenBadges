name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Procesar carpetas publish/ (mover badges y certificados nuevos)
        run: |
          mkdir -p src/content/badges/publish src/content/assertions/publish
          # Si hay cola de emails pendientes en publish/ (raíz o subcarpetas), guardarla en /tmp
          for pfile in publish/_pending-emails.json src/content/assertions/publish/_pending-emails.json src/content/assertions/_pending-emails.json; do
            if [ -f "$pfile" ]; then
              cp "$pfile" /tmp/pending-emails.json
              rm -f "$pfile"
            fi
          done
          # Clasificar automáticamente cualquier archivo .json subido en publish/ (raíz del repositorio)
          if [ -d publish ]; then
            for f in publish/*.json; do
              [ -e "$f" ] || continue
              if grep -q '"recipient"' "$f"; then
                mv -f "$f" src/content/assertions/
              else
                mv -f "$f" src/content/badges/
              fi
            done
          fi
          # Mover cualquier badge nueva desde src/content/badges/publish/ a badges/
          find src/content/badges/publish -maxdepth 1 -type f -name "*.json" ! -name "_*" -exec mv -f {} src/content/badges/ \;
          # Mover cualquier certificado nuevo desde src/content/assertions/publish/ a assertions/
          find src/content/assertions/publish -maxdepth 1 -type f -name "*.json" ! -name "_*" -exec mv -f {} src/content/assertions/ \;

      - name: Build site
        env:
          SITE_URL: "https://gdguhu.es"
          BASE_PATH: "/"
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Subir cola temporal de emails (si existe)
        if: hashFiles('/tmp/pending-emails.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pending-emails-queue
          path: /tmp/pending-emails.json
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  post-deploy-emails:
    name: Enviar Correos Automáticos y Limpiar publish/
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enviar correos pendientes y limpiar carpeta publish/
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: "https://gdguhu.es"
        run: |
          HAS_CHANGES=false
          PENDING_FILE=""

          for pfile in publish/_pending-emails.json src/content/assertions/publish/_pending-emails.json src/content/assertions/_pending-emails.json; do
            if [ -f "$pfile" ]; then
              cp "$pfile" /tmp/pending-emails.json
              rm -f "$pfile"
              PENDING_FILE="/tmp/pending-emails.json"
              HAS_CHANGES=true
            fi
          done

          # Si se subió la carpeta publish/ directamente en la raíz, clasificar cada .json automáticamente
          if [ -d publish ]; then
            for f in publish/*.json; do
              [ -e "$f" ] || continue
              if grep -q '"recipient"' "$f"; then
                mv -f "$f" src/content/assertions/
              else
                mv -f "$f" src/content/badges/
              fi
              HAS_CHANGES=true
            done
            rmdir publish 2>/dev/null || rm -rf publish
            HAS_CHANGES=true
          fi

          # Mover archivos de publish/ a sus carpetas definitivas si estaban en subcarpetas publish/
          for f in src/content/badges/publish/*.json; do
            [ -e "$f" ] || continue
            mv -f "$f" src/content/badges/
            HAS_CHANGES=true
          done
          for f in src/content/assertions/publish/*.json; do
            [ -e "$f" ] || continue
            mv -f "$f" src/content/assertions/
            HAS_CHANGES=true
          done

          if [ "$HAS_CHANGES" = "true" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A publish src/content/badges/ src/content/assertions/ 2>/dev/null || git add src/content/badges/ src/content/assertions/
            if ! git diff --staged --quiet; then
              git commit -m "chore(publish): organizar certificados publicados y limpiar cola temporal [skip ci]"
              git push origin main
            fi
          fi

          if [ -n "$PENDING_FILE" ] && [ -f "$PENDING_FILE" ]; then
            npm install nodemailer
            node scripts/send-emails.mjs "$PENDING_FILE"
            rm -f "$PENDING_FILE"
          fi

